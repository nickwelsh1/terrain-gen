<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Babylon Lite Storage Buffer Test v4</title>
    <style>
        body { margin: 0; background: #1a1a1a; color: #e0e0e0; }
        #renderCanvas { display: block; width: 100vw; height: 100vh; touch-action: none; }
        #status { position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); }
    </style>
</head>
<body>
    <canvas id="renderCanvas"></canvas>
    <div id="status">Loading...</div>
    <script type="module">
        import {
            createEngine,
            createSceneContext,
            createDefaultCamera,
            createHemisphericLight,
            createGround,
            createShaderMaterial,
            createStorageBuffer,
            attachControl,
            addToScene,
            registerScene,
            startEngine,
            setShaderStorageBuffer,
        } from "@babylonjs/lite";

        const canvas = document.getElementById("renderCanvas");
        const status = document.getElementById("status");

        try {
            status.textContent = "Creating engine...";
            const engine = await createEngine(canvas);
            const scene = createSceneContext(engine);
            scene.clearColor = { r: 0.1, g: 0.1, b: 0.15, a: 1.0 };

            const camera = createDefaultCamera(scene);
            camera.alpha = -Math.PI / 2;
            camera.beta = Math.PI / 3;
            camera.radius = 10;
            attachControl(camera, canvas, scene);

            addToScene(scene, createHemisphericLight([0, 1, 0], 1.0));

            // Small storage buffer — just 4 floats
            const data = new Float32Array([0.3, 0.8, 0.2, 1.0]); // green RGBA
            const colorBuffer = createStorageBuffer(engine, data, "colorBuf");
            console.log("Storage buffer created");

            // Same small ground as test1 (which worked)
            const ground = createGround(engine, { width: 4, height: 4, subdivisions: 1 });

            // Same shader as test1 but reads color from storage buffer in fragment
            const mat = createShaderMaterial({
                name: "testMat4",
                vertexSource: `
                    struct VertexOutput {
                        @builtin(position) position: vec4f,
                        @location(0) uv: vec2f,
                    };
                    @vertex
                    fn mainVertex(input: VertexInput) -> VertexOutput {
                        var out: VertexOutput;
                        out.position = shaderSystem.viewProjection * vec4f(input.position, 1.0);
                        out.uv = input.uv;
                        return out;
                    }
                `,
                fragmentSource: `
                    struct FragmentInput {
                        @builtin(position) position: vec4f,
                        @location(0) uv: vec2f,
                    };
                    @fragment
                    fn mainFragment(input: FragmentInput) -> @location(0) vec4f {
                        return vec4f(colors[0], colors[1], colors[2], colors[3]);
                    }
                `,
                attributes: ["position", "uv"],
                uniforms: ["viewProjection"],
                storageBuffers: [
                    { name: "colors", type: "array<f32>" },
                ],
            });
            console.log("Material created");

            setShaderStorageBuffer(mat, "colors", colorBuffer);
            console.log("Storage buffer bound");

            ground.material = mat;
            addToScene(scene, ground);

            await registerScene(scene);
            console.log("Scene registered");

            status.style.display = "none";
            await startEngine(engine);
            console.log("Engine started — should see green plane reading color from storage buffer");
        } catch (err) {
            status.textContent = "Error: " + err.message;
            status.style.color = "#ff6060";
            console.error(err);
        }
    </script>
</body>
</html>

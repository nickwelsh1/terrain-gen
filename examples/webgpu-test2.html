<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Babylon Lite Storage Buffer Test</title>
    <style>
        body {
            margin: 0;
            background: #1a1a1a;
            color: #e0e0e0;
        }

        #renderCanvas {
            display: block;
            width: 100vw;
            height: 100vh;
            touch-action: none;
        }

        #status {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
        }
    </style>
</head>

<body>
    <canvas id="renderCanvas"></canvas>
    <div id="status">Loading...</div>
    <script type="module">
        import {
            createEngine,
            createSceneContext,
            createDefaultCamera,
            createHemisphericLight,
            createGround,
            createShaderMaterial,
            createStorageBuffer,
            attachControl,
            addToScene,
            registerScene,
            startEngine,
            setShaderStorageBuffer,
        } from "@babylonjs/lite";

        const canvas = document.getElementById("renderCanvas");
        const status = document.getElementById("status");

        // Grid size must match shader constants
        const N = 256;
        const GRID_CELLS = N * N;
        const FIXED_SCALE = 10000.0;
        const AREA_M = 2560;

        try {
            status.textContent = "Creating engine...";
            const engine = await createEngine(canvas);
            const scene = createSceneContext(engine);
            scene.clearColor = { r: 0.1, g: 0.1, b: 0.15, a: 1.0 };

            // Use createDefaultCamera like the working snippet
            const camera = createDefaultCamera(scene);
            camera.alpha = -Math.PI / 2;
            camera.beta = Math.PI / 3;
            camera.radius = AREA_M * 1.5;
            attachControl(camera, canvas, scene);

            addToScene(scene, createHemisphericLight([0, 1, 0], 1.0));

            // Create storage buffer with a simple sine-wave height pattern
            const heights = new Int32Array(GRID_CELLS);
            for (let y = 0; y < N; y++) {
                for (let x = 0; x < N; x++) {
                    const dx = (x - N / 2) / N;
                    const dy = (y - N / 2) / N;
                    const dist = Math.sqrt(dx * dx + dy * dy);
                    const h = Math.sin(dist * 20) * 200 + 250; // 50..450 meters
                    heights[y * N + x] = Math.floor(h * FIXED_SCALE);
                }
            }
            const heightBuffer = createStorageBuffer(engine, heights, "testHeights");
            console.log("Height buffer created, sample values:", heights[0], heights[N * N / 2], heights[N * N - 1]);

            // Ground mesh
            const ground = createGround(engine, {
                width: AREA_M,
                height: AREA_M,
                subdivisions: N - 1,
            });
            console.log("Ground created", ground);

            // Use viewProjection system uniform (worldViewProjection) like the working snippet
            const mat = createShaderMaterial({
                name: "terrainTest",
                vertexSource: `
                    const N_F : f32 = ${N}.0;
                    const N_U : u32 = ${N}u;
                    const FIXED_SCALE : f32 = ${FIXED_SCALE}.0;

                    struct VertexOutput {
                        @builtin(position) position: vec4f,
                        @location(0) uv: vec2f,
                        @location(1) height: f32,
                    };

                    @vertex
                    fn mainVertex(input: VertexInput) -> VertexOutput {
                        var out: VertexOutput;
                        let gridX = input.uv.x * (N_F - 1.0);
                        let gridY = (1.0 - input.uv.y) * (N_F - 1.0);
                        let ix = u32(clamp(gridX, 0.0, N_F - 1.0));
                        let iy = u32(clamp(gridY, 0.0, N_F - 1.0));
                        let idx = iy * N_U + ix;
                        let h = f32(heights[idx]) / FIXED_SCALE;
                        let worldPos = vec3f(input.position.x, h, input.position.z);
                        out.position = shaderSystem.viewProjection * vec4f(worldPos, 1.0);
                        out.uv = input.uv;
                        out.height = h;
                        return out;
                    }
                `,
                fragmentSource: `
                    struct FragmentInput {
                        @builtin(position) position: vec4f,
                        @location(0) uv: vec2f,
                        @location(1) height: f32,
                    };

                    @fragment
                    fn mainFragment(input: FragmentInput) -> @location(0) vec4f {
                        let h = clamp(input.height / 500.0, 0.0, 1.0);
                        return vec4f(h, h, h, 1.0);
                    }
                `,
                attributes: ["position", "uv"],
                uniforms: ["viewProjection"],
                storageBuffers: [
                    { name: "heights", type: "array<i32>" },
                ],
            });
            console.log("Material created");

            setShaderStorageBuffer(mat, "heights", heightBuffer);
            console.log("Storage buffer bound");

            ground.material = mat;
            addToScene(scene, ground);

            await registerScene(scene);
            console.log("Scene registered");

            status.style.display = "none";
            await startEngine(engine);
            console.log("Engine started");
        } catch (err) {
            status.textContent = "Error: " + err.message;
            status.style.color = "#ff6060";
            console.error(err);
        }
    </script>

</body>

</html>
